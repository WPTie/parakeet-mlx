[package]
name = "awaz-mlx"
version = "0.1.0"
edition = "2024"
description = "Fast, native Parakeet speech recognition for Apple Silicon and desktop systems"
license = "Apache-2.0"
rust-version = "1.85"

[[bin]]
name = "awaz-mlx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
bzip2 = "0.6.1"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive", "env"] }
directories = "6.0.0"
indicatif = "0.18.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sherpa-onnx = "1.13.4"
tar = "0.4.46"
ureq = "3.3.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[profile.dev]
debug = 1
